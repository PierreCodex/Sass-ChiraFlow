# Página "Muy pronto" de tivuapp.com, mientras no está la landing.
# En Coolify: Project → + New → Docker Compose Empty → pegar todo esto.
# Coolify crea index.html con el contenido de `content` (función propia de Coolify).
services:
  pronto:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - type: bind
        source: ./index.html
        target: /usr/share/nginx/html/index.html
        read_only: true
        content: |
          <!doctype html>
          <html lang="es">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>tivu · Muy pronto</title>
          <meta name="description" content="tivu: reservas online para clínicas, salones y barberías. Muy pronto.">
          <meta name="theme-color" content="#4A2CF5">
          <style>
            :root { --fondo:#F7F6FF; --texto:#14163A; --suave:#5B5E7E; --violeta:#4A2CF5; --menta:#33F3CE; --tarjeta:#FFFFFF; }
            @media (prefers-color-scheme: dark) {
              :root { --fondo:#0E0F24; --texto:#F2F2FA; --suave:#A9ABC8; --tarjeta:#17193A; }
            }
            * { box-sizing:border-box; margin:0; }
            body {
              min-height:100vh; display:grid; place-items:center; padding:24px 16px;
              background:
                radial-gradient(600px 400px at 85% 10%, color-mix(in srgb, var(--menta) 22%, transparent), transparent),
                radial-gradient(700px 500px at 10% 90%, color-mix(in srgb, var(--violeta) 18%, transparent), transparent),
                var(--fondo);
              color:var(--texto);
              font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            }
            main { width:100%; max-width:520px; text-align:center; }
            .logo { height:64px; width:auto; margin-bottom:40px; }
            .chip {
              display:inline-block; padding:6px 14px; border-radius:999px; font-size:14px; font-weight:600;
              color:var(--violeta); background:color-mix(in srgb, var(--violeta) 12%, transparent);
            }
            @media (prefers-color-scheme: dark) { .chip { color:var(--menta); background:color-mix(in srgb, var(--menta) 14%, transparent); } }
            h1 { font-size:clamp(32px, 7vw, 46px); line-height:1.1; letter-spacing:-0.02em; margin:20px 0 16px; text-wrap:balance; }
            p { font-size:18px; line-height:1.55; color:var(--suave); text-wrap:pretty; }
            .contacto { margin-top:36px; font-size:15px; }
            .contacto a { color:var(--violeta); font-weight:600; text-decoration:none; }
            @media (prefers-color-scheme: dark) { .contacto a { color:var(--menta); } }
            .contacto a:hover { text-decoration:underline; }
          </style>
          </head>
          <body>
          <main>
            <picture>
              <source srcset="data:image/png;base64," media="(prefers-color-scheme: dark)">
              <img class="logo" src="data:image/png;base64," alt="tivu" width="207" height="64">
            </picture>
            <div><span class="chip">Muy pronto</span></div>
            <h1>Tus clientes reservan solos.</h1>
            <p>Agenda, recordatorios por WhatsApp y una tienda online propia para clínicas, salones y barberías.</p>
            <p class="contacto">¿Quieres ser de los primeros? Escríbenos a <a href="mailto:contacto@tivuapp.com">contacto@tivuapp.com</a></p>
          </main>
          </body>
          </html>
