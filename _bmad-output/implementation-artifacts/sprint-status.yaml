sprint_2:
  nombre: "Cada sede ofrece lo que de verdad ofrece"
  objetivo: >-
    Que el negocio decida qué servicios da cada sede y que una sola regla,
    en un solo sitio, diga qué se puede reservar en el panel, en la tienda y
    en el enlace del cliente. Desbloquea la tienda pública (épica 6).
  abierto: "2026-11-03"
  historias: ["2.1", "2.2", "2.3", "3.1"]
  backend_claude:
    en_orden: ["2.1", "2.2"]
    motivo_del_orden: "la regla de la 2.2 necesita local_servicio, que crea la 2.1"
    apoyo: ["2.3 (el dato del aviso en la API)"]
  frontend:
    "2.1": "claude: sección «Servicios de cada sede» en Administración → Locales"
    "2.3": "codex: el aviso en el servicio y en la sede, despues de 2.1 y 2.2"
    "3.1": "codex: mostrar y copiar el código en la ficha y buscar por él; el backend ya está (Backend-Sass #12)"
  fichas: ["spec-2-1-servicios-por-sede.md", "spec-2-2-regla-unica-reservable.md", "spec-2-3-servicio-sin-quien-lo-preste.md"]
  pruebas_que_no_se_tocan:
    - "La suite completa en verde antes de cada merge, incluida Concurrencia"
    - "Las pruebas de la 1.3 (reservabilidad en citas) siguen en verde sin tocarlas"
    - "Cada condición de la regla única tiene su prueba, y una de coherencia entre la consulta y la evaluación"
  criterio_de_cierre:
    - "Ningún camino ofrece o acepta una combinación que la regla única rechaza"
    - "Migración de local_servicio probada sobre un negocio existente (todo habilitado)"
    - "Contrato primero en api-contract.md (AD-13)"
    - "develop pasa a main por PR al cerrar, con la suite completa en verde"
  decisiones_pendientes_que_no_bloquean:
    - "Formato de la dirección de las tiendas: RESUELTO el 2026-11-03, {slug}.tivuapp.store (PR #38)"

sprint_3:
  nombre: "La tienda abre la puerta"
  objetivo: >-
    Que cada negocio tenga su dirección {slug}.tivuapp.store y la de cada sede,
    y que el cliente vea el catálogo y los huecos reales y arme su reserva
    antes de dar sus datos. Al cerrar, el cliente navega la tienda de verdad;
    reservar (6.6 en adelante) espera al correo (épica 4) y a la marca (épica 5).
  abierto: "2026-11-04"
  historias: ["6.1", "6.2", "6.3", "6.4", "6.5"]
  arrastra_del_sprint_2: ["2.3 (aviso en pantalla, codex)", "3.1 (codex)"]
