    "6.2": "claude con apoyo de codex"
    "6.3": "codex con apoyo de claude"
    "6.5": "codex con apoyo de claude"
  fichas: ["spec-6-1-direccion-publica.md", "spec-6-2-enlace-por-sede.md"]
  pruebas_que_no_se_tocan:
    - "La suite completa en verde antes de cada merge, incluida Concurrencia"
    - "Las de la regla única (2.2) y el aviso (2.3) siguen en verde sin tocarlas"
    - "Cada respuesta pública tiene su prueba de que no lleva ids internos ni datos del panel"
  criterio_de_cierre:
    - "Ninguna petición desde un host de tienda llega a una ruta del panel ni lleva credenciales"
