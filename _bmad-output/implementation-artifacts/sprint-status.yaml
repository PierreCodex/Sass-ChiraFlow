    - "La suite completa en verde, incluida la de aislacion entre negocios"
    - "bmad-code-review antes de mergear cada historia que toque CitaService"
    - "Una rama por historia (sprint-N/historia) salida de develop y de vuelta a develop por PR con merge commit; develop pasa a main por PR al cerrar el sprint (desde 2026-10-31)"
  fuera_de_este_sprint: ["1.8", "1.10", "1.12", "1.13", "1.15", "3.2", "3.3"]
  cerrado: "2026-11-03"
  cierre: >-
    Las 15 historias en develop y develop pasado a main (Backend-Sass #16,
    Sass-ChiraFlow #34). Suite completa en verde (448 + las 2 de
