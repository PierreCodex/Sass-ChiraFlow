  # «lista». Reglas comunes:
  #   - Rama desde origin/develop con el nombre indicado; PR a develop.
  #     Nunca push ni merge a develop/main. typecheck en verde antes de la PR.
  #   - No tocar D:/PERSONAL_JEAN/Backend-Sass (Claude trabaja ahí).
  #   - Si hace falta un endpoint o un campo que no está en
  #     D:/PERSONAL_JEAN/Sass-ChiraFlow/docs/api-contract.md: PARAR y anotarlo
  #     en «bloqueo» de la historia; lo resuelve Claude (contrato primero).
  #   - Codex NO edita este archivo (es de otro repo): al terminar, deja en
  #     la descripción de su PR la historia y lo que quedó pendiente. Los
  #     estados de aquí los actualiza Claude al revisar la PR.
  #   - Datos de ejemplo: se mantienen marcados con «Ejemplo» (decisión del
  #     2026-11-15). Nada se borra sin que Jean lo apruebe.
  # -------------------------------------------------------------------------
  cola_codex:
    - historia: "3.2"
      titulo: "El calendario del día por profesional"
      estado: hecha
      rama: "sprint-5/3-2-calendario-por-profesional"
      que_hacer: >-
        Ya existe en v2 (PR tivu.v2 #5, rango desde/hasta del backend #49).
        Cotejar cada criterio de epics.md § Story 3.2 contra lo construido,
        hacer lo que falte (columna «cerrada» del profesional sin jornada,
        clic en hueco libre → formulario con profesional, sede y hora,
        descansos) y verificarlo en el navegador. Sin arrastrar (Q-19). El
        caso dorado con Vitest solo si docs/fixtures/ ya existe; si no,
        anotarlo en «bloqueo» y seguir con lo demás.
      pr: "tivu.v2 #57 (mergeada 2026-11-18); revisión: tivu.v2 #58 (paginación de opciones)"
      bloqueo: >-
        Caso dorado hecho por Claude (2026-11-18): docs/fixtures/disponibilidad.json,
        leído por tivu.v2 (npm run test:disponibilidad) y por Pest. Queda
        `npm run test:reservabilidad`, que espera nombres de sede de mocks
        viejos («la molina», «Sucursal Miraflores»).
    - historia: "9.3"
      titulo: "Ninguna pantalla miente (fase 1: inventario y guardia)"
      estado: lista
      rama: "sprint-5/9-3-inventario-de-ejemplos"
      que_hacer: >-
        NO quitar datos de ejemplo. (1) Inventario: una tabla en
        docs/pantallas-con-ejemplo.md de tivu.v2 con cada pantalla o tarjeta
        que pinta datos de ejemplo o mocks, si lleva la marca «Ejemplo» y
        qué endpoint le falta. (2) Marcar con «Ejemplo» lo que se vea sin
        marca. (3) Una comprobación automática (script en package.json) que
        falle si la construcción de producción sirve mocks sin marcar. Lo de
        quitar módulos del menú vía GET /capacidades queda para la fase 2,
        con Jean.
      pr: "tivu.v2 #59 (mergeada 2026-11-18)"
      bloqueo: null
    - historia: "5.1"
      titulo: "La marca del negocio, en todos los planes"
      estado: hecha
      rama: "sprint-5/5-1-marca-del-negocio"
      que_hacer: >-
        El backend ya lo da (Backend-Sass, rama
        sprint-5/5-1-apariencia-del-negocio): antes de empezar, comprobar
        que su PR está mergeada en develop; si no, parar. Contrato:
        docs/api-contract.md § Configuración del negocio → Apariencia, y
        § Tienda pública. (1) Configuración → Marca pasa a ser «Apariencia»:
        logo, color principal con 8 colores sugeridos y la muestra de un
        botón con `texto_sobre_color`, estilo de portada (sólido, degradado,
        foto), galería de los 8 degradados + «de tu color», foto con punto de
        enfoque. Un 422 de color propone el tono que trae el mensaje.
        Quitar de la pantalla el color secundario y la portada vieja (cover);
        el backend los sigue aceptando hasta la 5.4. (2) La tienda, sus
        sedes, la página de la cita y la tienda cerrada usan `negocio`
        (logo_url, color_primario, texto_sobre_color, apariencia) en vez del
        logo, color y banner de la sede. Portada con `srcset` de
        url_800/1600/2400 y `object-position` del enfoque; capa de al menos
        0.55 sobre la foto (DESIGN.md store-hero). (3) Sin identidad
        configurada: la apariencia por defecto, sin huecos rotos.
        Verificar en el navegador en móvil y escritorio.
      pr: "tivu.v2 #61 (revisada por Claude 2026-11-18); backend Backend-Sass #69"
      bloqueo: null
    - historia: "5.3"
      titulo: "Ver cómo queda antes de que lo vea nadie"
      estado: hecha
      pr: "Hecha por Claude (Codex en pausa, 2026-11-18): Backend-Sass #74, tivu.v2 #66"
      bloqueo: null
    - historia: "5.4"
      titulo: "Las sedes dejan de tener identidad propia (parte de frontend)"
      estado: hecha
      orden: "después de la 5.1"
      rama: "sprint-5/5-4-sedes-sin-identidad"
      que_hacer: >-
        El backend ya está (Backend-Sass, rama
        sprint-5/5-4-identidad-al-negocio): comprobar que su PR está en
        develop; si no, parar. Contrato: docs/api-contract.md § Configuración
        del negocio → «Traslado de las sedes». (1) En Apariencia, si
        `aviso_traslado` no es null: el aviso «Tus sedes tenían colores o
        logos distintos; ahora todas usan los del negocio», la lista de
        `sedes` con «Usar el de esta sede» (color → PUT color_primario; logo
        → PUT adoptar_logo_de_sede) y cerrar → PUT aviso_traslado_visto. Si
        `texto_sobre_color` es null, marcar el color para corregirlo. (2) Al
        entrar al panel con `aviso_traslado` pendiente, un aviso que lleva a
        Apariencia. (3) La ficha de la sede ya no ofrece color, banner ni
        logo: dice «Usa el logo, el color y la portada del negocio» con
        enlace a Apariencia. (4) Quitar el color secundario de toda pantalla.
      pr: "tivu.v2 #63 (revisada por Claude); backend #70 y #72"
      bloqueo: null
    - historia: "9.4"
      titulo: "Los primeros pasos, explicados"
      estado: bloqueada
      bloqueo: "falta el texto del tutorial de los seis pasos (Jean)"

