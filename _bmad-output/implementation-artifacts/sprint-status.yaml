    Que nadie pueda agendar por otro, moverse de sede ni concederse permisos, y
    que lo que el panel ensena sea verdad. Sin esto no se abre nada al publico.
  estimacion: "3-4 dias de trabajo efectivo (propuesta, seccion Q-01)"
  backend_claude:
    secuencial_mismo_archivo: ["1.1", "1.2", "1.3"]
    despues: ["1.4", "1.5", "1.6", "1.7", "1.9"]
  frontend_codex:
    en_paralelo_desde_el_primer_dia: ["1.11", "1.14"]
    en_espera: ["3.1"]
  dependencias_verificadas_2026_09_20:
    - historia: "1.11"
      veredicto: "independiente"
      evidencia: "routes/api.php:83 GET /user, :94 PUT /user, :87 PUT /user/password
        ya existen"
    - historia: "1.14"
      veredicto: "independiente"
      evidencia: "app/Support/RolesSistema.php:25 MODULOS no incluye 'grupos' (cuelga
        de 'locales'), asi que ocultarlo es solo menu y rutas del panel"
    - historia: "3.1"
      veredicto: "NO independiente: necesita backend primero"
      evidencia: "CitaResource.php:26 ya emite 'codigo', pero CitaController.php:32-40
        solo busca por cliente (nombre, apellido, telefono)"
      accion: "Claude anade 'codigo' a la busqueda de GET /citas (contrato primero,
        AD-13); Codex conecta la pantalla despues"
  cobertura_de_los_huecos_de_seguridad:
    G-1: {historia: "1.1", que_cierra: "un profesional agenda o reasigna citas de
        un companero"}
    G-2: {historia: "1.2", que_cierra: "crear o mover citas a una sede fuera del alcance"}
    G-3: {historia: "1.3", que_cierra: "citas imposibles: profesional inactivo, no
        habilitado en la sede o que no presta el servicio"}
    G-4: {historia: "1.4", que_cierra: "POST /profesionales crea cuentas con mas permisos
        y alcance que el actor"}
    nota: "los cuatro estan dentro del Sprint 1"
  pruebas_que_no_se_tocan:
    - "La suite completa en verde antes de abrir la primera historia (linea base)
      y antes de cada merge"
    - "Las pruebas de aislacion entre negocios (404 a lo ajeno) se conservan y se
      amplian, nunca se relajan"
    - "Cada historia de G-1..G-4 anade una prueba que falla sin el arreglo"
    - "bmad-code-review antes de integrar toda historia que toque CitaService o Disponibilidad"
  criterio_de_cierre:
